<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<!-- 폰 화면 설정: 폰에서 열었을 때 PC 화면처럼 작게 줄어들지 않게 합니다. 지우지 마세요. -->
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<!-- ================= 1. 앱 정보 (여기만 바꾸세요) =================
     카톡, 인스타 등에 링크를 보냈을 때 미리보기 카드에 그대로 나옵니다.
     - 앱 이름: <title>과 og:title 두 곳을 같게
     - 한 줄 소개: description과 og:description 두 곳을 같게
     - 주소: '아이디'와 '저장소' 부분을 내 GitHub 아이디와 저장소 이름으로
================================================================== -->
<title>앱 이름</title>
<meta name="description" content="한 줄 소개가 여기에 들어갑니다.">
<meta property="og:type" content="website">
<meta property="og:title" content="앱 이름">
<meta property="og:description" content="한 줄 소개가 여기에 들어갑니다.">
<meta property="og:url" content="https://ted-pickle.github.io/freshman-web-template/">
<meta property="og:image" content="https://ted-pickle.github.io/freshman-web-template/og-image.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<!-- ================= 앱 정보 끝 ================= -->

<meta name="theme-color" content="#f6f4ef">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="favicon.png">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">

<style>
  /* ---------- 기본 설정 ---------- */
  :root {
    --bg: #f6f4ef;      /* 배경색 */
    --ink: #1f1d1a;     /* 글자색 */
    --muted: #8a847a;   /* 흐린 글자색 */
    --line: #e2ddd2;    /* 선 색 */
    --bar-h: 60px;      /* 하단 바 높이 */
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { min-height: 100%; }
  body {
    font-family: "Pretendard Variable", Pretendard, -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
    background: var(--bg);
    color: var(--ink);
    -webkit-font-smoothing: antialiased;
    -webkit-tap-highlight-color: transparent;
    word-break: keep-all;
  }

  /* ---------- 앱 영역: 폰 세로 화면 기준, PC에서는 가운데 정렬 ---------- */
  #app {
    max-width: 480px;
    min-height: 100dvh;
    margin: 0 auto;
    padding: 28px 20px calc(var(--bar-h) + 28px + env(safe-area-inset-bottom));
  }

  /* ---------- 시작 화면 (앱을 만들면 지워도 됩니다) ---------- */
  .starter { display: flex; flex-direction: column; gap: 14px; }
  .starter h1 { font-size: 34px; line-height: 1.2; letter-spacing: -0.025em; font-weight: 750; margin-top: 12px; }
  .starter .lead { font-size: 16px; line-height: 1.6; color: var(--muted); }
  .starter .stage {
    margin-top: 18px;
    aspect-ratio: 3 / 4;
    border: 1px solid var(--line);
    border-radius: 14px;
    background-color: #fbfaf7;
    background-image: radial-gradient(var(--line) 1px, transparent 1px);
    background-size: 18px 18px;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 6px; padding: 24px; text-align: center;
  }
  .starter .stage p { font-size: 15px; line-height: 1.6; }
  .starter .stage .hint { font-size: 13px; color: var(--muted); }

  /* ================= 2. 하단 고정 바 (만든 사람 + 공유 버튼) =================
     디자인은 바꿔도 되지만, 지우지는 마세요. */
  .bar {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 1000;
    background: rgba(246, 244, 239, 0.9);
    -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px);
    border-top: 1px solid var(--line);
    padding-bottom: env(safe-area-inset-bottom);
  }
  .bar-inner {
    max-width: 480px; height: var(--bar-h); margin: 0 auto;
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
    padding: 0 14px 0 20px;
  }
  .credit { min-width: 0; font-size: 12px; line-height: 1.4; color: var(--muted); text-decoration: none; }
  .credit span { display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .credit b { color: var(--ink); font-weight: 650; }
  .share-btn {
    flex: none; height: 38px; padding: 0 14px;
    display: inline-flex; align-items: center; gap: 6px;
    border: 1px solid var(--ink); border-radius: 10px;
    background: transparent; color: var(--ink);
    font: inherit; font-size: 14px; font-weight: 650; cursor: pointer;
  }
  .share-btn:active { background: var(--ink); color: var(--bg); }
  .share-btn svg { width: 16px; height: 16px; }
  .toast {
    position: fixed; left: 50%; bottom: calc(var(--bar-h) + 16px + env(safe-area-inset-bottom));
    transform: translate(-50%, 8px); opacity: 0; pointer-events: none;
    background: var(--ink); color: var(--bg);
    font-size: 14px; padding: 10px 16px; border-radius: 10px;
    transition: opacity .2s, transform .2s; z-index: 1001; white-space: nowrap;
  }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }
</style>
</head>
<body>

<!-- ================= 3. 앱은 이 안에 만듭니다 ================= -->
<main id="app">
  <section class="starter">
    <h1>앱 이름</h1>
    <p class="lead">한 줄 소개가 여기에 들어갑니다.</p>
    <div class="stage">
      <p>이 자리에 Claude와 함께 만들 화면이 들어갑니다.</p>
      <p class="hint">README.md의 기획 시트부터 채워 주세요.</p>
    </div>
  </section>
</main>
<!-- ================= 앱 끝 ================= -->

<!-- 하단 고정 바: 이름과 학교·학과, GitHub 아이디만 바꾸세요 -->
<footer class="bar">
  <div class="bar-inner">
    <a class="credit" href="https://github.com/아이디" target="_blank" rel="noopener">
      <span>만든 사람 <b>홍길동</b></span>
      <span>OO대학교 OO학과</span>
    </a>
    <button class="share-btn" id="share-btn" type="button" aria-label="이 페이지 공유하기">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v12"/><path d="M7 8l5-5 5 5"/><path d="M5 13v6a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-6"/></svg>
      공유
    </button>
  </div>
</footer>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
  // 공유 버튼: 폰에서는 공유 창(카톡, 인스타 등)이 뜨고, 안 되는 곳에서는 링크를 복사합니다.
  // 주소에 붙은 ?점수=... 같은 값도 그대로 공유되므로, "내 기록 깨 봐" 링크에도 쓸 수 있습니다.
  function showToast(message) {
    const toast = document.getElementById('toast');
    toast.textContent = message;
    toast.classList.add('show');
    clearTimeout(showToast.timer);
    showToast.timer = setTimeout(() => toast.classList.remove('show'), 1800);
  }

  document.getElementById('share-btn').addEventListener('click', async () => {
    const shareData = {
      title: document.title,
      text: document.querySelector('meta[name="description"]').content,
      url: location.href,
    };
    if (navigator.share) {
      try {
        await navigator.share(shareData);
        return;
      } catch (error) {
        if (error.name === 'AbortError') return; // 사용자가 공유 창을 닫은 경우
      }
    }
    try {
      await navigator.clipboard.writeText(shareData.url);
      showToast('링크를 복사했어요');
    } catch (error) {
      window.prompt('아래 링크를 복사해서 보내세요', shareData.url);
    }
  });
</script>
</body>
</html>
